# macOS 판 빌드: 태그(v*)를 올리거나 직접 실행하면 Apple Silicon / Intel 용 DMG 를 만든다.
# 서명·공증은 하지 않는다 (Apple 개발자 계정 없음). 처음 열 때 경고가 뜨는 것은 README 에 안내.
name: macOS build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          TUBEGET_LANG: ko
          ACORTUBE_FAST_EXIT: "1"
        run: python -m pytest -q tests

      - name: Version
        id: ver
        run: |
          VER=$(python -c "import tubegetapp; print(tubegetapp.APP_VERSION)")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Acortube $VER (${{ matrix.arch }})"

      - name: Build app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Acortube \
            --icon assets/icon.png --add-data "assets:assets" --paths . \
            --collect-submodules tubegetapp \
            --osx-bundle-identifier io.github.formathyun.acortube main.py
          PLIST=dist/Acortube.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "${{ steps.ver.outputs.ver }}" "$PLIST"
          plutil -replace CFBundleVersion -string "${{ steps.ver.outputs.ver }}" "$PLIST"
          plutil -replace NSHighResolutionCapable -bool true "$PLIST"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$PLIST"
          # Info.plist 를 고쳤으니 임시(ad-hoc) 서명을 다시 한다 (Apple Silicon 은 서명이 없으면 실행이 안 됨)
          codesign --force --deep --sign - dist/Acortube.app
          codesign --verify --deep --strict dist/Acortube.app

      - name: Smoke test (launch for 10 s)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export TUBEGET_HOME="$RUNNER_TEMP/acortube-home"
          ./dist/Acortube.app/Contents/MacOS/Acortube &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then echo "app is running"; kill "$PID"; else echo "app exited early"; wait "$PID"; exit 1; fi

      - name: Make DMG
        run: |
          NAME="Acortube-${{ steps.ver.outputs.ver }}-macOS-${{ matrix.arch }}"
          mkdir -p dmg
          cp -R dist/Acortube.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Acortube" -srcfolder dmg -ov -format UDZO "$NAME.dmg"
          ls -la "$NAME.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Acortube-macOS-${{ matrix.arch }}
          path: Acortube-*-macOS-*.dmg
          if-no-files-found: error
